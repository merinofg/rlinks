[package]
name = "rlinks"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed", "form"] }
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.11"
futures = "0.3.34"
hmac = "0.13.0"
lol_html = "3.0.3"
object_store = { version = "0.14.2", features = ["aws"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "gzip"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
